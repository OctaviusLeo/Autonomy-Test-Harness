# Compose project ath-jenkins: the local Jenkins controller (started by scripts/jenkins_up.sh, which sets
# ATH_SHARED, ATH_REPO, DOCKER_GID, and ATH_JENKINS_ENV_FILE). It listens only on 127.0.0.1:8090.
name: ath-jenkins
services:
  jenkins:
    build: .
    image: ath-jenkins:local
    container_name: ath-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      # The Git plugin refuses file:// checkouts unless allowed (SECURITY-2478); acceptable because the
      # controller listens only on 127.0.0.1 and builds only this repository.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
      ATH_SHARED: "${ATH_SHARED}"
    env_file:
      - "${ATH_JENKINS_ENV_FILE}"
    group_add:
      - "${DOCKER_GID}"
    volumes:
      - ath_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - "${ATH_REPO}:/repo:ro"
      - "${ATH_SHARED}:${ATH_SHARED}"
volumes:
  ath_jenkins_home:
    name: ath_jenkins_home
