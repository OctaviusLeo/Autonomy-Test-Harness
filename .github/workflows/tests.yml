# The unit and property tests that need neither ROS 2 nor the simulator, on a GitHub-hosted runner.
# The full unit suite (including the tests marked ros) and the scenario suites run in the ath-sim image
# under Jenkins (ci/Jenkinsfile); this workflow is the quick check a reviewer sees on GitHub.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m "not sim and not ros" -p no:cacheprovider
