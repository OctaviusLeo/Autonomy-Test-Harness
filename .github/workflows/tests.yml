# The unit and property tests that need neither ROS 2 nor the simulator, on a GitHub-hosted runner.
# The full unit suite (including the tests marked ros) and the scenario suites run in the ath-sim image
# under Jenkins (ci/Jenkinsfile); this workflow is the quick check a reviewer sees on GitHub, plus a
# Ruff lint of the whole repository.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.1"
          # Its own cache key: otherwise this fast job saves a nearly empty uv cache under the
          # key the unit job expects, and the unit job re-downloads everything on every run.
          cache-suffix: lint
      # Rules in ruff.toml; the pinned Ruff keeps the check the same from run to run.
      - run: uvx ruff@0.17.1 check --output-format=github .

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -m "not sim and not ros" -p no:cacheprovider
