# RunConfig (design.md, "RunConfig" and "Oracle design"). Fixed before any run; never changed to
# alter a result (Requirement 0.4). Loaded and validated by harness/runner/run_config.py.
footprint_radius_m: 0.18         # Create 3 body 0.164 m, front bumper 0.175 m
collision_threshold_m: 0.02      # clearance below 2 cm counts as contact (no contact sensor on the model)
goal_position_tol_m: 0.30        # Nav2's goal checker uses 0.25 m on its estimate; +0.05 m for estimate-to-truth
goal_orientation_tol_rad: 0.30   # Nav2's 0.25 rad + 0.05 rad, for the same reason
startup_timeout_s: 180.0         # simulation and Nav2 must be ready within this (wall clock)
settle_s: 2.0                    # simulation seconds recorded after the goal finishes
stall_timeout_s: 180.0           # no change in a run's logs or bag for this long (wall clock) = stalled; retried once
raw_scan_topic: /scan            # the simulation's lidar (from its own bridge)
faulted_scan_topic: /scan_ath    # the Fault_Injector's output, which Nav2 reads
ground_truth_topic: /ath/ground_truth/robot_pose
robot_name: turtlebot4           # the Gazebo model name observed at M0
bag_topics:                      # recorded per run (camera topics are not recorded)
  - /scan
  - /scan_ath
  - /odom
  - /tf
  - /tf_static
  - /cmd_vel
  - /amcl_pose
  - /plan
  - /ath/ground_truth/robot_pose
  - /ath/goal_dispatch
  - /ath/faults/active
  - /navigate_to_pose/_action/status
