# GeneratorConfig (see design.md > Data Models > GeneratorConfig).
# Defaults describe the design.md example world `empty_10x10` (a 10x10 map,
# bounds -5..5 on each axis) so start (-4,-4) / goal (4,4) fall inside it.
seed: 42                      # single generation seed (Req 0.2, 3.2)
n: 10                         # number of feasible scenarios to produce
map_bounds:                   # sampling region for poses and obstacles
  x_min: -5.0
  x_max: 5.0
  y_min: -5.0
  y_max: 5.0
obstacle_count:               # range of obstacles per scenario
  min: 1
  max: 5
obstacle_size:                # size range per obstacle dimension (meters)
  min: 0.2
  max: 0.8
robot_radius_m: 0.22          # footprint radius used to inflate the occupancy grid
grid_resolution_m: 0.05       # occupancy-grid cell size for the feasibility check
